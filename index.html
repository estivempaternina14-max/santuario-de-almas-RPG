<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Santuario de Almas - RPG</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div id="stars-container"></div>

    <div id="tarjeta-contenedor">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('register')">Forjar Usuario</button>
            <button class="tab-btn" onclick="switchTab('login')">Iniciar Sesión</button>
        </div>

        <form id="form-registro" class="auth-form">
            <div class="campo">
                <label for="nombre">Nombre de Héroe</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="campo">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">COMENZAR AVENTURA</button>
        </form>

        <form id="form-login" class="auth-form" style="display: none;">
            <div class="campo">
                <label for="login-email">Correo Electrónico</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="campo">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit">ENTRAR AL SANTUARIO</button>
        </form>
    </div>

    <div id="jugador"></div>

    <script src="script.js"></script>
</body>
</html>
